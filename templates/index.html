<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>North Shore Photographic Society: Files</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
  <main class="container">
    <div class="container-lg mb-3 pb-3 border-bottom">
        <img src="https://www.nsps.ca/wp-content/uploads/2017/07/cropped-NSPS_logo_banner_750x150px.png" style="height: 8em">
        <p class="mt-3">Welcome to the NSPS file server. <a href="https://nsps.ca">Return to the main site</a> 👈</p>
    </div>    
    <div class="container-lg" style="max-width: 26rem">    
      <div class="card shadow-sm mt-5">
        <div class="card-body p-4 text-center">
          {% if user %}
            {% if user.picture %}
              <img src="{{ user.picture }}" alt="" width="72" height="72" class="rounded-circle mb-3">
            {% endif %}
            <h1 class="h4 mb-1">{{ user.name }}</h1>
            {% if user.email %}<p class="text-secondary mb-3">{{ user.email }}</p>{% endif %}
            <a class="btn btn-primary w-100 mb-2" href="{{ url_for('listing') }}">Browse Drive files</a>
            <a class="btn btn-outline-secondary w-100" href="{{ url_for('logout') }}">Log out</a>
          {% else %}
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 122.8 122.8" width="64" height="64"
                 class="mb-3" role="img" aria-label="Slack">
              <path fill="#E01E5A" d="M25.8 77.6c0 7.1-5.8 12.9-12.9 12.9S0 84.7 0 77.6s5.8-12.9 12.9-12.9h12.9v12.9zm6.5 0c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9v32.3c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V77.6z"/>
              <path fill="#36C5F0" d="M45.2 25.8c-7.1 0-12.9-5.8-12.9-12.9S38.1 0 45.2 0s12.9 5.8 12.9 12.9v12.9H45.2zm0 6.5c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H12.9C5.8 58.1 0 52.3 0 45.2s5.8-12.9 12.9-12.9h32.3z"/>
              <path fill="#2EB67D" d="M97 45.2c0-7.1 5.8-12.9 12.9-12.9s12.9 5.8 12.9 12.9-5.8 12.9-12.9 12.9H97V45.2zm-6.5 0c0 7.1-5.8 12.9-12.9 12.9s-12.9-5.8-12.9-12.9V12.9C64.7 5.8 70.5 0 77.6 0s12.9 5.8 12.9 12.9v32.3z"/>
              <path fill="#ECB22E" d="M77.6 97c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9-12.9-5.8-12.9-12.9V97h12.9zm0-6.5c-7.1 0-12.9-5.8-12.9-12.9s5.8-12.9 12.9-12.9h32.3c7.1 0 12.9 5.8 12.9 12.9s-5.8 12.9-12.9 12.9H77.6z"/>
            </svg>
            <h1 class="h4 mb-3">Sign in</h1>
            <a class="btn btn-primary w-100" href="{{ url_for('login') }}">Sign in with Slack</a>
          {% endif %}
        </div>
      </div>
    </div>
  </main>
</body>
</html>
